appId: com.travelhub.app
---
# Reusable login subflow — robust against either app entry point:
#   1) Welcome screen (initialRouteName=welcome on a truly fresh install / CI)
#   2) (tabs)/index ("Explore") if navigation state was persisted
#
# Both paths converge on /login.
#
# Env vars:
#   TEST_EMAIL     — seeded TRAVELER from backend/db/03-seed.sql
#   TEST_PASSWORD  — matching password (all seeded users share "travelhub")

# Path 1: welcome → /login
- tapOn:
    id: "welcome-login-cta"
    optional: true

# Path 2: tabs → profile → /login (only fires if we're not on welcome)
- tapOn:
    id: "profile-tab"
    optional: true
- tapOn:
    id: "profile-login-cta"
    optional: true

# We should now be on /login regardless of how we got here.
- assertVisible:
    text: "Email"
    waitToSettleTimeoutMs: 3000

- tapOn:
    text: "Email"
- inputText: ${TEST_EMAIL}

- tapOn:
    text: "Password"
- inputText: ${TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit"

# Land on home — search CTA proves the tab stack is up and auth context is set.
- assertVisible:
    id: "home-search-cta"
    waitToSettleTimeoutMs: 3000