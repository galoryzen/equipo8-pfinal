appId: com.travelhub.app
---
# Reusable login subflow.
# Pre-condition: app launched (lands on (tabs)/index — "Explore" — after clearState).
# Post-condition: app is on (tabs)/index logged in as TEST_EMAIL.
#
# Note: even with clearState, the app boots into the tabs stack (not /welcome),
# so we navigate to login via the Profile tab → "Log in" CTA on profile screen.
#
# Env vars:
#   TEST_EMAIL     — seeded TRAVELER from backend/db/03-seed.sql
#   TEST_PASSWORD  — matching password (all seeded users share "travelhub")

- tapOn:
    id: "profile-tab"

- tapOn:
    id: "profile-login-cta"

- tapOn:
    text: "Email"
- inputText: ${TEST_EMAIL}

- tapOn:
    text: "Password"
- inputText: ${TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit"

# Land on home — search CTA proves the tab stack is up and auth context is set.
- assertVisible:
    id: "home-search-cta"
    waitToSettleTimeoutMs: 3000
