name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mobile:
              - 'mobile/**'

  mobile-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:coverage

  mobile-e2e:
    runs-on: ubuntu-latest
    needs: [changes, mobile-ci]
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      - name: Start backend stack
        working-directory: backend
        run: docker compose up -d --wait
        timeout-minutes: 10

      - name: Stub google-services.json
        working-directory: mobile
        run: |
          cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "travelhub-e2e-stub",
              "storage_bucket": "travelhub-e2e-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.travelhub.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDummy_Stub_Key_For_E2E_Builds_Only_x" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Prebuild Android project
        working-directory: mobile
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Tune gradle for CI
        working-directory: mobile
        run: |
          cat >> android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=true
          # Emulator is x86_64 — skip the other 3 ABIs to cut CMake builds
          # (reanimated, expo-modules-core, hermes) by ~75%.
          reactNativeArchitectures=x86_64
          PROPS

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api33-google-apis-x86_64-v1

      - name: Build app & run Maestro on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: mobile
          script: |
            ./android/gradlew :app:assembleDebug -p android --build-cache --parallel
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.travelhub.app/.MainActivity
            maestro test .maestro/flows/ --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            mobile/maestro-report.xml
            mobile/.maestro/.cache

      - name: Stop backend stack
        if: always()
        working-directory: backend
        run: docker compose down -v

  mobile-result:
    runs-on: ubuntu-latest
    needs: [changes, mobile-ci, mobile-e2e]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.mobile-ci.result }}" = "failure" ]; then
            echo "Mobile unit tests failed"
            exit 1
          fi
          if [ "${{ needs.mobile-e2e.result }}" = "failure" ]; then
            echo "Mobile E2E failed"
            exit 1
          fi
          echo "Mobile CI passed (unit: ${{ needs.mobile-ci.result }}, e2e: ${{ needs.mobile-e2e.result }})"
